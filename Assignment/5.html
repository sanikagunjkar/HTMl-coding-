<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Block vs inline </title>
</head>
<body>
  <div>
    <h1>you are on right page</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing.</p>
    <p>Lorem ipsum dolor <span>sit</span> amet consectetur adipisicing.</p>
    <p>This are inline element</p>
    <b>bold</b>
    <i>italic</i>
    <u>underline</u>
    <del>delete</del>

    
  </div>
</body>
</html>
